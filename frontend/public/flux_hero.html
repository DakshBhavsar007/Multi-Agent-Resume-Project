<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLUX — Creative Motion & Brand Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #17151f;
      -webkit-font-smoothing: antialiased;
    }

    .bg-video {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0; pointer-events: none;
      filter: blur(2px) saturate(1.06);
      transform: scale(1.06);
    }

    .scrim {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,0.94) 0%, rgba(255,255,255,0.80) 30%, rgba(255,255,255,0.46) 58%, rgba(255,255,255,0.20) 100%),
        linear-gradient(to bottom, rgba(255,255,255,0.85) 0%, transparent 18%, transparent 82%, rgba(255,255,255,0.90) 100%);
    }

    .scrim::after {
      content: '';
      position: absolute; top: 46%; left: 50%;
      transform: translate(-50%, -50%);
      width: 640px; height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,108,255,0.10) 0%, transparent 62%);
      filter: blur(40px);
      pointer-events: none;
    }

    .shell {
      position: relative; z-index: 2; height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 26px clamp(28px, 4vw, 60px) 28px;
    }

    /* Motion Blur-Rise */
    @keyframes blurRise {
      from { opacity: 0; filter: blur(16px); transform: translateY(30px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    .rise {
      opacity: 0;
      animation: blurRise 1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    .delay-0 { animation-delay: 0ms; }
    .delay-1 { animation-delay: 70ms; }
    .delay-2 { animation-delay: 120ms; }
    .delay-3 { animation-delay: 170ms; }
    .delay-4 { animation-delay: 220ms; }
    .delay-5 { animation-delay: 300ms; }
    .delay-6 { animation-delay: 380ms; }
    .delay-7 { animation-delay: 490ms; }
    .delay-8 { animation-delay: 600ms; }
    .delay-9 { animation-delay: 720ms; }

    /* Nav Header */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800; font-size: 21px;
      letter-spacing: -0.01em; color: #17151f; text-decoration: none;
    }

    .brand-mark {
      width: 15px; height: 15px; border-radius: 4px;
      background: linear-gradient(150deg, #a99bff, #7c6cff);
      box-shadow: 0 2px 8px rgba(124, 108, 255, 0.4);
    }

    .nav-links {
      display: flex; gap: 32px; list-style: none; align-items: center;
    }

    .nav-links a {
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      color: #6a6577; text-decoration: none; transition: color 0.2s ease;
    }

    .nav-links a:hover { color: #17151f; }

    .nav-cta {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 13px;
      padding: 11px 20px; border-radius: 999px; background-color: #17151f; color: #ffffff;
      text-decoration: none; transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(23, 21, 31, 0.12);
    }

    .nav-cta:hover { transform: translateY(-1px); background-color: #272335; }

    /* Hero Middle */
    .hero-content {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; max-width: 900px; margin: 0 auto;
    }

    .kicker {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.30em; color: #6a6577;
      display: inline-flex; align-items: center; gap: 14px; margin-bottom: 30px;
    }

    .kicker::before, .kicker::after {
      content: ''; display: inline-block; width: 26px; height: 1.5px;
      background-color: #7c6cff; opacity: 0.6;
    }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
      font-size: clamp(64px, 8.5vw, 136px); line-height: 0.92;
      letter-spacing: -0.045em; color: #17151f; margin-bottom: 24px;
    }

    h1 .dot { color: #7c6cff; }

    .sub-line {
      font-family: 'Inter', sans-serif; font-size: clamp(17px, 1.8vw, 20px);
      font-weight: 400; color: #6a6577; max-width: 440px; margin-bottom: 40px;
      line-height: 1.5;
    }

    .cta-row {
      display: flex; align-items: center; justify-content: center; gap: 26px;
    }

    .btn-primary {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 15px;
      padding: 15px 30px; border-radius: 999px; background-color: #17151f; color: #ffffff;
      text-decoration: none; transition: all 0.25s cubic-bezier(0.2, 0.7, 0.2, 1);
      box-shadow: 0 10px 30px rgba(23, 21, 31, 0.15); display: inline-flex; align-items: center; gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px); background-color: #272335;
      box-shadow: 0 14px 36px rgba(23, 21, 31, 0.22);
    }

    .btn-primary svg { transition: transform 0.2s ease; }
    .btn-primary:hover svg { transform: translateX(3px); }

    .btn-secondary {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px;
      color: #17151f; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      transition: color 0.2s ease;
    }

    .btn-secondary::after {
      content: '→'; font-family: sans-serif; color: #7c6cff;
      transition: transform 0.2s ease;
    }

    .btn-secondary:hover { color: #7c6cff; }
    .btn-secondary:hover::after { transform: translateX(4px); }

    /* Footer Meta Row */
    .meta-row {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.16em; color: #9a94a6;
    }

    .meta-dot {
      width: 4px; height: 4px; border-radius: 50%; background-color: #7c6cff; opacity: 0.7;
    }

    @media (max-width: 720px) {
      .nav-links { display: none; }
      .cta-row { flex-direction: column; gap: 16px; }
      .meta-row { flex-wrap: wrap; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise { opacity: 1; animation: none; filter: none; transform: none; }
      .bg-video { filter: saturate(1.06); }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video class="bg-video" id="fluxVideo" autoplay muted loop playsinline src="https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/flux.mp4"></video>

  <!-- Ambient Scrim Wash -->
  <div class="scrim"></div>

  <!-- Main Shell Content -->
  <div class="shell">
    <!-- Navbar -->
    <nav>
      <a href="#" class="brand rise delay-0">
        <span class="brand-mark"></span>
        FLUX
      </a>
      <ul class="nav-links">
        <li><a href="#" class="rise delay-1">Work</a></li>
        <li><a href="#" class="rise delay-2">Studio</a></li>
        <li><a href="#" class="rise delay-3">Contact</a></li>
      </ul>
      <a href="#" class="nav-cta rise delay-4">Start a project</a>
    </nav>

    <!-- Center Hero -->
    <main class="hero-content">
      <div class="kicker rise delay-5">MOTION & BRAND</div>
      <h1 class="rise delay-6">Make it move<span class="dot">.</span></h1>
      <p class="sub-line rise delay-7">A studio for brands that refuse to sit still.</p>
      <div class="cta-row rise delay-8">
        <a href="#" class="btn-primary">
          See our work
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </a>
        <a href="#" class="btn-secondary">Get in touch</a>
      </div>
    </main>

    <!-- Bottom Meta Row -->
    <footer class="meta-row rise delay-9">
      <span>Brand identity</span>
      <span class="meta-dot"></span>
      <span>Motion design</span>
      <span class="meta-dot"></span>
      <span>Film & CGI</span>
    </footer>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const v = document.getElementById('fluxVideo');
      if (v) {
        v.play().catch(() => {});
        v.addEventListener('canplay', () => v.play().catch(() => {}));
      }
    });
  </script>
</body>
</html>
